name: CI

on:
  push:
    branches: [main, "product/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install backend dependencies
        run: npm --prefix backend install --no-audit --no-fund

      - name: Unit and API tests
        run: npm run test:all

      - name: HTTP smoke test
        run: npm run smoke

      - name: Dependency audit
        run: npm audit --prefix backend --audit-level=high

      - name: Static checks
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Verify output
        run: test -f dist/index.html && test -f dist/src/app.js && test -f dist/src/data.js && test -f dist/src/storage.js
