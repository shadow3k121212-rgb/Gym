name: CI

on:
  push:
    branches: [main, "product/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Unit tests
        run: npm test
      - name: Static checks
        run: npm run check
      - name: Production build
        run: npm run build
      - name: Verify output
        run: test -f dist/index.html && test -f dist/src/app.js
